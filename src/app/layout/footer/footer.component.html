<footer class="footer">
  <div class="footer__stripe" aria-hidden="true"></div>
  <div class="footer__inner">
    <div class="footer__brand">
      <a class="brand" routerLink="/" [attr.aria-label]="brand + ' home'">
        <img class="brand__mark" src="favicon.svg" width="36" height="36" alt="" />
        <span class="brand__name">{{ brand }}</span>
      </a>
      <p class="footer__about">{{ about }}</p>
    </div>

    <nav class="footer__col" aria-label="Product">
      <h2 class="footer__title">Product</h2>
      <a *ngFor="let l of links" [href]="'/#' + l.id" (click)="goTo(l.id, $event)">{{ l.label }}</a>
    </nav>

    <nav class="footer__col" aria-label="Account">
      <h2 class="footer__title">Account</h2>
      <a routerLink="/login">Log in</a>
      <a routerLink="/login" [queryParams]="signupParams">Create a page</a>
    </nav>

    <nav class="footer__col" aria-label="Legal">
      <h2 class="footer__title">Legal</h2>
      <a routerLink="/terms">Terms of Use</a>
      <a routerLink="/privacy">Privacy Policy</a>
      <a routerLink="/refunds">Refund Policy</a>
    </nav>
  </div>

  <div class="footer__bottom">
    <p>&copy; {{ year }} {{ brand }}. Made in Lagos <i class="fa-solid fa-heart" aria-hidden="true"></i></p>
  </div>
</footer>
